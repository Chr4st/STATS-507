# Instrument definitions for GeoAg Arb Terminal
# Each instrument has contract specs, session info, and region mapping

instruments:
  ZC:
    name: "Corn Futures"
    exchange: "CME"
    currency: "USD"
    tick_size: 0.25
    tick_value: 12.50
    contract_size: 5000        # bushels
    settlement: "physical"
    exercise_style: "american"
    last_trade_day_offset: -1  # business days before 15th of delivery month
    front_months: ["H", "K", "N", "U", "Z"]
    timezone: "America/Chicago"
    session:
      electronic_open: "19:00"
      electronic_close: "07:45"
      pit_open: "08:30"
      pit_close: "13:20"
      break_start: "07:45"
      break_end: "08:30"
    regions: ["US_CORN_BELT"]
    proxy_etf: "CORN"

