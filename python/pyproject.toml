[project]
name = "geoag-arb-terminal"
version = "0.1.0"
description = "GeoAg Arb Terminal: Satellite + Weather → Crop Nowcast → Regional Arb Signals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
    "yfinance>=0.2.36",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
geoag-server = "geoag.api.server:main"
geoag-download = "geoag.ingest.download_data:main"
geoag-ingest = "geoag.ingest.ingest_service:run_ingest"
geoag-features = "geoag.features.feature_service:run_features"
geoag-train = "geoag.model.train:train_model"
geoag-signals = "geoag.signals.signal_service:run_signals"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
